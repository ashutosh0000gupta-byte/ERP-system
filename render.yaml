services:
  # Backend Express API Service
  - type: web
    name: hrms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist-seed/prisma/seed.js && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  # PostgreSQL Database Service
  - name: hrms-postgres
    plan: free
    databaseName: hrms_db
    user: hrms_admin
